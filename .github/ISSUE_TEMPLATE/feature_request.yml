name: Feature request
description: Propose a new capability or a change in behavior.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended ideas are often easier to explore in
        [Discussions](https://github.com/orca-ae/orca-cli/discussions/categories/ideas) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and what gets in your way today. Leave the solution for the next field.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What alternatives have you considered?
  - type: dropdown
    id: contract
    attributes:
      label: Does this change a public contract?
      description: >-
        Public contracts are command names, arguments and flags, the default and `-o json` output, exit
        statuses, `ORCA_*` environment variables, the files and ports of `ork local`, the container
        image's user and entrypoint, and the Go API of `pkg/cmd/workspace`.
      options:
        - "No"
        - "Yes, it changes one of these contracts"
        - Not sure
    validations:
      required: true
