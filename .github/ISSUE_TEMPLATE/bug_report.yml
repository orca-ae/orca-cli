name: Bug report
description: Something in the ork CLI doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please don't report security vulnerabilities here.
        Follow [SECURITY.md](https://github.com/orca-ae/orca-cli/blob/main/SECURITY.md) instead.

        If the problem is in Orca Agent Engine itself rather than in `ork`, report it in the
        [engine repository](https://github.com/orca-ae/orca-agent-engine/issues/new/choose).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, and include any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The `ork` commands you ran, with credentials removed, and the smallest setup that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ork version
      description: The output of `ork --version`, or the commit you built from.
      placeholder: "ork version 0.5.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install ork?
      options:
        - Homebrew
        - Release archive
        - go install
        - Container image
        - Built from source
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Orca Agent Engine version and deployment
      description: >-
        The engine release, and how it runs: `ork local`, Kubernetes, or the hosted distribution. Say
        so if you don't know.
      placeholder: "v0.5.0 via ork local"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Your operating system and architecture, your shell, and for `ork local`, your Docker and
        Docker Compose versions.
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >-
        Paste the command's output here. It is formatted as code automatically. Remove API keys,
        tokens and other secrets first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and didn't find this problem.
          required: true
        - label: This isn't a security vulnerability.
          required: true
